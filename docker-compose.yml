services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD_FILE=/run/secrets/db-password
      - DB_DATABASE=dns_record_manager
    secrets:
      - db-password
    depends_on:
      db:
        condition: service_healthy
    command: php -S 0.0.0.0:3000 -t public
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/schema/init.sql:ro
      - ./database/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      POSTGRES_DB: dns_record_manager
    secrets:
      - db-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U root -d dns_record_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
  dns-cron:
    build:
      context: .
      dockerfile: ./docker/cron/Dockerfile.cron
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD_FILE=/run/secrets/db-password
      - DB_DATABASE=dns_record_manager
    secrets:
      - db-password
    depends_on:
      db:
        condition: service_healthy
    restart: always
  test:
    build:
      context: .
      target: test
    profiles:
      - test
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD_FILE=/run/secrets/db-password
      - DB_DATABASE=dns_record_manager_test
    secrets:
      - db-password
    command: ./vendor/bin/phpunit
volumes:
  db-data:
secrets:
  db-password:
    file: ./secrets/db/password.txt