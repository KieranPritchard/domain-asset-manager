name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Prepare & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dns_record_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d dns_record_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD_FILE: ${{ github.workspace }}/.ci-db-password
      DB_DATABASE: dns_record_manager

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set-up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP files
        uses: overtrue/phplint@main
        with:
          path: .
          options: --exclude=vendor

      - name: Create DB password file
        run: printf '%s' 'test' > .ci-db-password

      - name: Load database schema
        run: psql -h 127.0.0.1 -U root -d dns_record_manager -f database/init.sql
        env:
          PGPASSWORD: test

      - name: Debug autoload
        run: |
          git ls-files app | head -40
          composer dump-autoload -o
          grep -n "Models" vendor/composer/autoload_classmap.php | head -10

      - name: Run PHPUnit
        run: vendor/bin/phpunit